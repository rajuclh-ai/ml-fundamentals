model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  max_length: 256

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - v_proj
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.001
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  output_dir: ./adapter
